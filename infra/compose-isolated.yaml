name: lab13-isolated
services:
  primary:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ha_lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?Set REPLICATION_PASSWORD}
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=5"]
    ports:
      - "127.0.0.1:5543:5432"
    volumes:
      - primary_data:/var/lib/postgresql/data
      - ./isolated/init-replication.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ha_lab"]
      interval: 3s
      timeout: 3s
      retries: 30

  replica:
    image: postgres:16
    depends_on:
      primary:
        condition: service_healthy
    environment:
      PGDATA: /var/lib/postgresql/data
      PGPASSWORD: ${REPLICATION_PASSWORD:?Set REPLICATION_PASSWORD}
    entrypoint: ["bash", "/opt/lab/replica-entrypoint.sh"]
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - replica_data:/var/lib/postgresql/data
      - ./isolated/replica-entrypoint.sh:/opt/lab/replica-entrypoint.sh:ro

volumes:
  primary_data:
  replica_data:
